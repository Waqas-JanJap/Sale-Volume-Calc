<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Sales Calculator</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.7.2/umd/Recharts.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
    }
    
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-row { flex-direction: row; }
    .lg\:flex-row { flex-direction: row; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .lg\:w-1\/3 { width: 33.333333%; }
    .lg\:w-2\/3 { width: 66.666667%; }
    .bg-gray-50 { background-color: #f9fafb; }
    .bg-white { background-color: white; }
    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .gap-4 { gap: 1rem; }
    .gap-6 { gap: 1.5rem; }
    .gap-2 { gap: 0.5rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .shadow { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); }
    .items-center { align-items: center; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mt-1 { margin-top: 0.25rem; }
    .space-y-6 > * + * { margin-top: 1.5rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .font-bold { font-weight: 700; }
    .font-medium { font-weight: 500; }
    .text-blue-600 { color: #2563eb; }
    .text-gray-800 { color: #1f2937; }
    .text-gray-700 { color: #374151; }
    .text-gray-500 { color: #6b7280; }
    .text-green-600 { color: #059669; }
    .text-red-600 { color: #dc2626; }
    .text-purple-600 { color: #7c3aed; }
    .bg-blue-50 { background-color: #eff6ff; }
    .bg-green-50 { background-color: #ecfdf5; }
    .bg-purple-50 { background-color: #f5f3ff; }
    .border { border-width: 1px; }
    .border-blue-100 { border-color: #dbeafe; }
    .border-green-100 { border-color: #d1fae5; }
    .border-purple-100 { border-color: #ede9fe; }
    .justify-between { justify-content: space-between; }
    .h-2 { height: 0.5rem; }
    .h-72 { height: 18rem; }
    .appearance-none { appearance: none; }
    .cursor-pointer { cursor: pointer; }
    .flex-1 { flex: 1 1 0%; }
    
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 5px;
      outline: none;
    }
    
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
    }
    
    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
    }
    
    @media (max-width: 1024px) {
      .flex-row {
        flex-direction: column;
      }
      
      .lg\:w-1\/3, .lg\:w-2\/3 {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    // Wait for all scripts to load before running our code
    window.onload = function() {
      const React = window.React;
      const ReactDOM = window.ReactDOM;
      const Recharts = window.Recharts;
      
      // Create a Sliders icon component
      function Sliders({ size = 24, className = "" }) {
        return React.createElement('svg', {
          xmlns: "http://www.w3.org/2000/svg",
          width: size,
          height: size,
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "2",
          strokeLinecap: "round",
          strokeLinejoin: "round",
          className: className
        }, [
          React.createElement('line', { key: 'l1', x1: "4", x2: "4", y1: "21", y2: "14" }),
          React.createElement('line', { key: 'l2', x1: "4", x2: "4", y1: "10", y2: "3" }),
          React.createElement('line', { key: 'l3', x1: "12", x2: "12", y1: "21", y2: "12" }),
          React.createElement('line', { key: 'l4', x1: "12", x2: "12", y1: "8", y2: "3" }),
          React.createElement('line', { key: 'l5', x1: "20", x2: "20", y1: "21", y2: "16" }),
          React.createElement('line', { key: 'l6', x1: "20", x2: "20", y1: "12", y2: "3" }),
          React.createElement('line', { key: 'l7', x1: "1", x2: "7", y1: "14", y2: "14" }),
          React.createElement('line', { key: 'l8', x1: "9", x2: "15", y1: "8", y2: "8" }),
          React.createElement('line', { key: 'l9', x1: "17", x2: "23", y1: "16", y2: "16" })
        ]);
      }
      
      const formatCurrency = (value) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }).format(value);
      };
      
      const formatNumber = (value) => {
        return new Intl.NumberFormat('en-US').format(value);
      };
      
      function CarSalesProfitCalculator() {
        // State for all input variables
        const [wholesaleCars, setWholesaleCars] = React.useState(180);
        const [retailCars, setRetailCars] = React.useState(50);
        const [wholesaleProfit, setWholesaleProfit] = React.useState(314);
        const [retailProfit, setRetailProfit] = React.useState(903);
        const [expenses, setExpenses] = React.useState(170000);
        
        // Derived calculations
        const [calculatedValues, setCalculatedValues] = React.useState({
          totalWholesaleProfit: 0,
          totalRetailProfit: 0,
          totalProfit: 0,
          netPosition: 0,
          retailCarsToBreakEven: 0,
          expenseReduction: 0,
          totalCarsToBreakEven: 0
        });
        
        // Chart data
        const [chartData, setChartData] = React.useState([]);
        
        // Update calculations whenever inputs change
        React.useEffect(() => {
          const totalWholesaleProfit = wholesaleCars * wholesaleProfit;
          const totalRetailProfit = retailCars * retailProfit;
          const totalProfit = totalWholesaleProfit + totalRetailProfit;
          const netPosition = totalProfit - expenses;
          
          // Calculate retail cars needed to break even (keeping wholesale the same)
          const retailCarsToBreakEven = Math.ceil((expenses - totalWholesaleProfit) / retailProfit);
          
          // Calculate how much expenses need to be reduced to break even
          const expenseReduction = netPosition < 0 ? Math.abs(netPosition) : 0;
          
          // Calculate total cars needed at current mix to break even
          const currentRatio = retailCars > 0 ? wholesaleCars / retailCars : 1;
          const currentAvgProfit = (totalWholesaleProfit + totalRetailProfit) / (wholesaleCars + retailCars || 1);
          const totalCarsToBreakEven = Math.ceil(expenses / currentAvgProfit);
          
          setCalculatedValues({
            totalWholesaleProfit,
            totalRetailProfit,
            totalProfit,
            netPosition,
            retailCarsToBreakEven: retailCarsToBreakEven > 0 ? retailCarsToBreakEven : 0,
            expenseReduction,
            totalCarsToBreakEven
          });
          
          // Update chart data
          setChartData([
            { name: 'Wholesale Profit', value: totalWholesaleProfit, color: '#4CAF50' },
            { name: 'Retail Profit', value: totalRetailProfit, color: '#2196F3' },
            { name: 'Total Profit', value: totalProfit, color: '#9C27B0' },
            { name: 'Expenses', value: expenses, color: '#FF5722' },
            { name: 'Net Position', value: netPosition, color: netPosition >= 0 ? '#4CAF50' : '#F44336' }
          ]);
          
        }, [wholesaleCars, retailCars, wholesaleProfit, retailProfit, expenses]);
        
        return React.createElement('div', { className: "flex flex-col lg:flex-row w-full h-full bg-gray-50 p-4 gap-6" }, [
          // Left sidebar with sliders
          React.createElement('div', { key: 'sidebar', className: "w-full lg:w-1/3 bg-white rounded-lg shadow p-6" }, [
            React.createElement('div', { key: 'header', className: "flex items-center gap-2 mb-6" }, [
              React.createElement(Sliders, { key: 'icon', size: 24, className: "text-blue-600" }),
              React.createElement('h2', { key: 'title', className: "text-xl font-bold text-gray-800" }, "Adjust Parameters")
            ]),
            
            // Sliders section
            React.createElement('div', { key: 'sliders', className: "space-y-6" }, [
              React.createElement('div', { key: 'slider1' }, [
                React.createElement('div', { key: 'label1', className: "flex justify-between mb-2" }, [
                  React.createElement('label', { key: 'text1', className: "text-sm font-medium text-gray-700" }, "Wholesale Cars"),
                  React.createElement('span', { key: 'value1', className: "text-sm font-bold" }, formatNumber(wholesaleCars))
                ]),
                React.createElement('input', {
                  key: 'input1',
                  type: "range",
                  min: 0,
                  max: 300,
                  value: wholesaleCars,
                  onChange: (e) => setWholesaleCars(parseInt(e.target.value)),
                  className: "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                })
              ]),
              
              React.createElement('div', { key: 'slider2' }, [
                React.createElement('div', { key: 'label2', className: "flex justify-between mb-2" }, [
                  React.createElement('label', { key: 'text2', className: "text-sm font-medium text-gray-700" }, "Retail Cars"),
                  React.createElement('span', { key: 'value2', className: "text-sm font-bold" }, formatNumber(retailCars))
                ]),
                React.createElement('input', {
                  key: 'input2',
                  type: "range",
                  min: 0,
                  max: 300,
                  value: retailCars,
                  onChange: (e) => setRetailCars(parseInt(e.target.value)),
                  className: "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                })
              ]),
              
              React.createElement('div', { key: 'slider3' }, [
                React.createElement('div', { key: 'label3', className: "flex justify-between mb-2" }, [
                  React.createElement('label', { key: 'text3', className: "text-sm font-medium text-gray-700" }, "Avg Wholesale Profit"),
                  React.createElement('span', { key: 'value3', className: "text-sm font-bold" }, formatCurrency(wholesaleProfit))
                ]),
                React.createElement('input', {
                  key: 'input3',
                  type: "range",
                  min: 0,
                  max: 1000,
                  value: wholesaleProfit,
                  onChange: (e) => setWholesaleProfit(parseInt(e.target.value)),
                  className: "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                })
              ]),
              
              React.createElement('div', { key: 'slider4' }, [
                React.createElement('div', { key: 'label4', className: "flex justify-between mb-2" }, [
                  React.createElement('label', { key: 'text4', className: "text-sm font-medium text-gray-700" }, "Avg Retail Profit"),
                  React.createElement('span', { key: 'value4', className: "text-sm font-bold" }, formatCurrency(retailProfit))
                ]),
                React.createElement('input', {
                  key: 'input4',
                  type: "range",
                  min: 0,
                  max: 2000,
                  value: retailProfit,
                  onChange: (e) => setRetailProfit(parseInt(e.target.value)),
                  className: "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                })
              ]),
              
              React.createElement('div', { key: 'slider5' }, [
                React.createElement('div', { key: 'label5', className: "flex justify-between mb-2" }, [
                  React.createElement('label', { key: 'text5', className: "text-sm font-medium text-gray-700" }, "Monthly Expenses"),
                  React.createElement('span', { key: 'value5', className: "text-sm font-bold" }, formatCurrency(expenses))
                ]),
                React.createElement('input', {
                  key: 'input5',
                  type: "range",
                  min: 50000,
                  max: 300000,
                  step: 1000,
                  value: expenses,
                  onChange: (e) => setExpenses(parseInt(e.target.value)),
                  className: "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                })
              ])
            ])
          ]),
          
          // Main content area with charts and metrics
          React.createElement('div', { key: 'main', className: "w-full lg:w-2/3 space-y-6" }, [
            // Summary cards
            React.createElement('div', { key: 'summary', className: "flex flex-row gap-4" }, [
              React.createElement('div', { key: 'card1', className: "bg-white rounded-lg shadow p-6 flex-1" }, [
                React.createElement('h3', { key: 'title1', className: "text-sm font-medium text-gray-500 mb-1" }, "Total Projected Profit"),
                React.createElement('p', { 
                  key: 'value1',
                  className: `text-2xl font-bold ${calculatedValues.totalProfit >= 0 ? 'text-green-600' : 'text-red-600'}`
                }, formatCurrency(calculatedValues.totalProfit))
              ]),
              
              React.createElement('div', { key: 'card2', className: "bg-white rounded-lg shadow p-6 flex-1" }, [
                React.createElement('h3', { key: 'title2', className: "text-sm font-medium text-gray-500 mb-1" }, "Monthly Operating Expenses"),
                React.createElement('p', { key: 'value2', className: "text-2xl font-bold text-red-600" }, formatCurrency(expenses))
              ]),
              
              React.createElement('div', { key: 'card3', className: "bg-white rounded-lg shadow p-6 flex-1" }, [
                React.createElement('h3', { key: 'title3', className: "text-sm font-medium text-gray-500 mb-1" }, "Net Position"),
                React.createElement('p', { 
                  key: 'value3',
                  className: `text-2xl font-bold ${calculatedValues.netPosition >= 0 ? 'text-green-600' : 'text-red-600'}`
                }, formatCurrency(calculatedValues.netPosition))
              ])
            ]),
            
            // Chart
            React.createElement('div', { key: 'chart-container', className: "bg-white rounded-lg shadow p-6" }, [
              React.createElement('h2', { key: 'chart-title', className: "text-xl font-bold text-gray-800 mb-4" }, "Financial Projections"),
              React.createElement('div', { key: 'chart', className: "h-72" }, [
                React.createElement(Recharts.ResponsiveContainer, { key: 'responsive', width: "100%", height: "100%" }, [
                  React.createElement(Recharts.BarChart, {
                    key: 'barchart',
                    layout: "vertical",
                    data: chartData,
                    margin: { top: 5, right: 30, left: 20, bottom: 5 }
                  }, [
                    React.createElement(Recharts.CartesianGrid, { key: 'grid', strokeDasharray: "3 3" }),
                    React.createElement(Recharts.XAxis, { key: 'xaxis', type: "number", tickFormatter: (value) => formatCurrency(value) }),
                    React.createElement(Recharts.YAxis, { key: 'yaxis', dataKey: "name", type: "category", width: 120 }),
                    React.createElement(Recharts.Tooltip, { key: 'tooltip', formatter: (value) => formatCurrency(value) }),
                    React.createElement(Recharts.Bar, { 
                      key: 'bar',
                      dataKey: "value", 
                      fill: "#8884d8", 
                      radius: [0, 4, 4, 0]
                    }, chartData.map((entry, index) => 
                      React.createElement('rect', { key: `rect-${index}`, fill: entry.color })
                    ))
                  ])
                ])
              ])
            ]),
            
            // Recommendations
            React.createElement('div', { key: 'recommendations', className: "bg-white rounded-lg shadow p-6" }, [
              React.createElement('h2', { key: 'rec-title', className: "text-xl font-bold text-gray-800 mb-4" }, "Break-Even Recommendations"),
              React.createElement('div', { key: 'rec-cards', className: "flex flex-row gap-4" }, [
                React.createElement('div', { key: 'rec1', className: "p-4 bg-blue-50 rounded-lg border border-blue-100 flex-1" }, [
                  React.createElement('h3', { key: 'rec1-title', className: "text-sm font-medium text-gray-700 mb-2" }, "Retail Cars to Break Even"),
                  React.createElement('p', { key: 'rec1-value', className: "text-xl font-bold text-blue-600" }, 
                    formatNumber(calculatedValues.retailCarsToBreakEven)
                  ),
                  React.createElement('p', { key: 'rec1-desc', className: "text-xs text-gray-500 mt-1" }, "Keeping current wholesale volume")
                ]),
                
                React.createElement('div', { key: 'rec2', className: "p-4 bg-green-50 rounded-lg border border-green-100 flex-1" }, [
                  React.createElement('h3', { key: 'rec2-title', className: "text-sm font-medium text-gray-700 mb-2" }, "Expense Reduction Needed"),
                  React.createElement('p', { key: 'rec2-value', className: "text-xl font-bold text-green-600" }, 
                    formatCurrency(calculatedValues.expenseReduction)
                  ),
                  React.createElement('p', { key: 'rec2-desc', className: "text-xs text-gray-500 mt-1" }, "To reach break-even point")
                ]),
                
                React.createElement('div', { key: 'rec3', className: "p-4 bg-purple-50 rounded-lg border border-purple-100 flex-1" }, [
                  React.createElement('h3', { key: 'rec3-title', className: "text-sm font-medium text-gray-700 mb-2" }, "Total Cars Needed"),
                  React.createElement('p', { key: 'rec3-value', className: "text-xl font-bold text-purple-600" }, 
                    formatNumber(calculatedValues.totalCarsToBreakEven)
                  ),
                  React.createElement('p', { key: 'rec3-desc', className: "text-xs text-gray-500 mt-1" }, "At current sales mix ratio")
                ])
              ])
            ])
          ])
        ]);
      }
      
      // Render the application using the new React 18 API
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(CarSalesProfitCalculator, null));
    };
  </script>
</body>
</html>
